{% extends "base.html" %}
{% block content %}
<div class="card" style="display:block; width:300px; padding:20px;">
  <h2 style="margin-top:0; margin-bottom:15px; text-align:left; font-size:1.4em; color:#333;">Registracija</h2>

  {% if error %}
    <p style="color:red; margin-bottom:10px;">{{ error }}</p>
  {% endif %}

  <form method="post" action="/users/register">
    <div class="field" style="margin-bottom:10px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px;">Vartotojo vardas:</label>
      <input type="text" name="username" required style="width:100%;">
    </div>
    <div class="field" style="margin-bottom:10px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px;">Slaptažodis:</label>
      <input type="password" name="password" required style="width:100%;">
    </div>

    <div style="margin-top:15px;">
      <button type="submit">Registruotis</button>
    </div>
  </form>

  <p style="margin-top:15px; text-align:left;">
    Turite paskyrą? <a href="/users/login">Prisijungti</a>
  </p>
</div>
{% endblock %}
